<!--
  Supabase → Authentication → Emails → "Reset Password".
  Subject: Kod do zmiany hasła: {{ .Token }}
  Uses {{ .Token }} (a code) instead of {{ .ConfirmationURL }} (a link), like
  confirm-signup.html. /weryfikacja?purpose=recovery expects the code, then
  /nowe-haslo sets the new password.
-->
<!doctype html>
<html lang="pl">
  <body style="margin:0;padding:0;background:#faf6f2;font-family:Helvetica,Arial,sans-serif;color:#2b2226;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#faf6f2;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:12px;padding:36px 28px;">
            <tr>
              <td style="font-family:Georgia,serif;font-size:22px;">Twój Color<span style="color:#a94a5a;">.</span></td>
            </tr>
            <tr>
              <td style="padding-top:28px;font-family:Georgia,serif;font-size:28px;line-height:1.2;">Ustaw nowe hasło</td>
            </tr>
            <tr>
              <td style="padding-top:14px;font-size:15px;line-height:1.6;color:#6b5e63;">Wpisz ten kod na stronie, aby ustawić nowe hasło:</td>
            </tr>
            <tr>
              <td align="center" style="padding:28px 0;">
                <div style="display:inline-block;background:#f6e9eb;border-radius:10px;padding:16px 28px;font-size:34px;font-weight:bold;letter-spacing:10px;color:#a94a5a;">{{ .Token }}</div>
              </td>
            </tr>
            <tr>
              <td style="font-size:13px;line-height:1.6;color:#6b5e63;">Kod jest ważny przez ograniczony czas. Jeśli to nie Ty prosiłaś o zmianę hasła, zignoruj tę wiadomość — Twoje hasło pozostanie bez zmian.</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
